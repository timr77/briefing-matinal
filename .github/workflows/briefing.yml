name: Briefing matinal

on:
  schedule:
    # 04:00 UTC = 05:00 à Stockholm en hiver, 06:00 en été.
    # GitHub peut retarder les tâches planifiées de plusieurs dizaines de minutes.
    - cron: "0 4 * * *"
  workflow_dispatch:  # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write  # pour committer docs/

concurrency:
  group: briefing

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le briefing et mettre à jour le flux
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --rss

      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Briefing du $(date -u +%F)"
          git push
