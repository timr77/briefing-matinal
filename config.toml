# Configuration du briefing matinal.
# Les chemins de fichiers sont relatifs au dossier du projet.

[ville]
nom = "Stockholm"
latitude = 59.3293
longitude = 18.0686
fuseau = "Europe/Stockholm"

[actualites]
# Flux lus pour constituer la liste de nouvelles candidates.
flux_rss = [
    "https://www.franceinfo.fr/titres.rss",
    "https://www.franceinfo.fr/sciences.rss",
    "https://www.franceinfo.fr/culture.rss",
    "https://www.franceinfo.fr/sports.rss",
    "https://www.franceinfo.fr/decouverte.rss",
    "https://www.franceinfo.fr/environnement.rss",
]
titres_par_flux = 8  # titres les plus récents lus dans chaque flux
nombre_titres = 5    # nouvelles retenues au maximum dans le briefing
# true : l'IA ne garde que les nouvelles encourageantes. Sans IA (gabarit),
# l'actualité est alors omise, faute de pouvoir juger le ton des nouvelles.
nouvelles_positives_uniquement = true
# Lire aussi le chapeau de chaque article (allonge le briefing vers ~2 min).
avec_resume = true

[phrases]
fichier = "phrases.txt"

[redaction]
# "gemini"  : API Gemini de Google, offre gratuite (clé dans GEMINI_API_KEY)
# "claude"  : API Claude, payante (clé dans ANTHROPIC_API_KEY)
# "gabarit" : phrases fixes, sans IA
# Si le rédacteur IA échoue, le gabarit prend automatiquement le relais.
moteur = "gemini"

[redaction.gemini]
# Essayés dans l'ordre ; le second sert de secours si le premier est saturé.
modeles = ["gemini-3.8-flash", "gemini-3.5-flash-lite"]

[redaction.claude]
modele = "claude-opus-5-5"
effort = "medium"  # low | medium | high : profondeur de réflexion du modèle

[sortie]
fichier = "briefing.txt"

[audio]
# Voix française : fr-FR-VivienneMultilingualNeural, fr-FR-RemyMultilingualNeural,
# fr-FR-DeniseNeural, fr-FR-HenriNeural, fr-FR-EloiseNeural
voix = "fr-FR-VivienneMultilingualNeural"
vitesse = "+0%"  # ex. "-10%" pour ralentir, "+10%" pour accélérer
nombre_fichiers = 7  # MP3 conservés en ligne

[rss]
dossier = "docs"  # servi tel quel par GitHub Pages
# À adapter : https://<pseudo-github>.github.io/<nom-du-depot>/
url_site = "https://timr77.github.io/briefing-matinal/"
titre = "Briefing matinal"
description = "Le mot du jour, la météo à Stockholm et les titres de franceinfo."
nombre_briefings = 30  # entrées conservées dans le flux

[reseau]
timeout = 10  # secondes
